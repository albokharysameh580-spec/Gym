<style>
/* Layout: one narrow column read like a gym whiteboard. A sticky header carries the 16-week strip;
   below it the day's session is a single sheet of ruled rows you tick off set by set. */
:root{
  --bg:#EEF1F5; --surface:#FDFDFE; --surface-2:#E7EBF1; --line:#D3D9E3;
  --ink:#131A2B; --ink-2:#465066; --muted:#667085;
  --accent:#2A78D6; --accent-strong:#1C5CAB; --accent-text:#1C5CAB; --on-accent:#FFFFFF; --accent-wash:#E1ECFA;
  --good:#0CA30C; --warn:#FAB219; --bad:#D03B3B;
  --good-ink:#006300; --warn-ink:#7A5200; --bad-ink:#A32626;
  --good-wash:#E3F4E3; --warn-wash:#FDF1D3; --bad-wash:#F9E1E1;
  --z1:#86B6EF; --z2:#5598E7; --z3:#2A78D6; --z4:#1C5CAB; --z5:#104281;
  --tip-bg:#131A2B; --tip-fg:#FDFDFE;
  --font-display:'Changa','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Sans Arabic',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181C; --surface:#1D252B; --surface-2:#27313A; --line:#34414B;
    --ink:#EEF1EC; --ink-2:#BCC5C8; --muted:#8B979F;
    --accent:#3987E5; --accent-strong:#3987E5; --accent-text:#86B6EF; --on-accent:#0B1220; --accent-wash:#1E3550;
    --good:#0CA30C; --warn:#FAB219; --bad:#D03B3B;
    --good-ink:#7BD67B; --warn-ink:#FAB219; --bad-ink:#F29090;
    --good-wash:#173420; --warn-wash:#3A3013; --bad-wash:#3D2023;
    --z1:#1C5CAB; --z2:#2A78D6; --z3:#5598E7; --z4:#86B6EF; --z5:#B7D3F6;
    --tip-bg:#EEF1EC; --tip-fg:#12181C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12181C; --surface:#1D252B; --surface-2:#27313A; --line:#34414B;
  --ink:#EEF1EC; --ink-2:#BCC5C8; --muted:#8B979F;
  --accent:#3987E5; --accent-strong:#3987E5; --accent-text:#86B6EF; --on-accent:#0B1220; --accent-wash:#1E3550;
  --good:#0CA30C; --warn:#FAB219; --bad:#D03B3B;
  --good-ink:#7BD67B; --warn-ink:#FAB219; --bad-ink:#F29090;
  --good-wash:#173420; --warn-wash:#3A3013; --bad-wash:#3D2023;
  --z1:#1C5CAB; --z2:#2A78D6; --z3:#5598E7; --z4:#86B6EF; --z5:#B7D3F6;
  --tip-bg:#EEF1EC; --tip-fg:#12181C;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;direction:rtl;-webkit-text-size-adjust:100%}
#app{max-width:680px;margin-inline:auto;padding-inline:16px;padding-block:0 56px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-text)}
bdi[dir=ltr]{unicode-bidi:isolate}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand h1{font:700 21px/1.2 var(--font-display)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)}
.sync.local i{background:var(--warn)}
.where{font-size:13px;color:var(--ink-2)}
.where b{font-weight:600;color:var(--ink)}
.strip{display:flex;gap:6px}
.ph{flex:1;min-width:0;display:grid;gap:3px}
.ph .wks{display:flex;gap:2px}
.wk{flex:1;min-width:0;height:26px;border-radius:4px;background:var(--surface-2);color:var(--muted);font:600 11px/26px var(--font-body);text-align:center;position:relative}
.wk.past{background:var(--accent-wash);color:var(--accent-text)}
.wk.now{background:var(--accent-strong);color:var(--on-accent)}
.wk.dl::after{content:"";position:absolute;inset-inline:28%;bottom:3px;height:2px;border-radius:2px;background:currentColor;opacity:.65}
.ph .pn{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.ph.cur .pn{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.tabs button{flex:1;min-width:0;border:0;background:transparent;font:600 14px/1.3 var(--font-body);color:var(--ink-2);padding:8px 2px;border-radius:7px}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

/* ---------- surfaces ---------- */
#view{display:grid;gap:14px;padding-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card > *{min-width:0}
.eye{font-size:12.5px;font-weight:600;color:var(--muted)}
.h{font:700 19px/1.3 var(--font-display);text-wrap:balance}
.h2{font:600 16px/1.35 var(--font-display)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.note{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink-2)}
.note.warn{background:var(--warn-wash);color:var(--ink)}
.note.bad{background:var(--bad-wash);color:var(--ink)}
.note.good{background:var(--good-wash);color:var(--ink)}
.sec{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.sec > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary::after{content:"+";font:600 18px/1 var(--font-body);color:var(--muted)}
.sec[open] > summary::after{content:"–"}
.sec-t{font:600 15px/1.3 var(--font-display)}
.sec-m{font-size:12.5px;color:var(--muted)}

/* ---------- controls ---------- */
.btn{border:1px solid var(--accent-strong);background:var(--accent-strong);color:var(--on-accent);font:600 15px/1.2 var(--font-body);padding:12px 16px;border-radius:9px;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent-text);border-color:var(--line)}
.btn.quiet{background:var(--surface-2);border-color:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13.5px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.field{display:grid;gap:4px;min-width:0}
.field > span{font-size:13px;color:var(--ink-2)}
.inp,select.inp,textarea.inp{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:500 16px/1.2 var(--font-body);padding:0 12px}
textarea.inp{height:auto;min-height:64px;padding:10px 12px;line-height:1.5;resize:vertical}
.inp.num{direction:ltr;text-align:center;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2.end{align-items:end}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:0;min-height:40px;font:600 15px/1 var(--font-body)}
.seg button[aria-pressed=true]{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.seg.tight button{min-height:34px;font-size:13.5px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.stepper{direction:ltr;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px;align-items:center}
.stepper button{height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:600 20px/1 var(--font-body)}
.stepper output{text-align:center;font:600 20px/1 var(--font-body)}
.stepper output small{font-size:13px;font-weight:500;color:var(--muted)}
.switch{display:flex;gap:10px;align-items:flex-start;border:0;background:transparent;padding:6px 0;text-align:start;font:500 14.5px/1.5 var(--font-body);width:100%}
.box{flex:none;width:22px;height:22px;margin-top:1px;border:1.5px solid var(--muted);border-radius:6px;display:grid;place-items:center;color:transparent}
[aria-checked=true] > .box,[aria-pressed=true] > .box{background:var(--good);border-color:var(--good);color:#fff}
.box svg{width:14px;height:14px}

/* ---------- status ---------- */
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:999px;font:600 13px/1.6 var(--font-body);background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill.green{background:var(--good-wash)} .pill.yellow{background:var(--warn-wash)} .pill.red{background:var(--bad-wash)}
.mark{width:10px;height:10px;display:inline-block;flex:none}
.mark.green{background:var(--good);border-radius:50%}
.mark.yellow{background:var(--warn);clip-path:polygon(50% 0,100% 100%,0 100%)}
.mark.red{background:var(--bad);border-radius:2px}

/* ---------- session ---------- */
.picker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.picker button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px;min-height:48px;display:grid;gap:1px;justify-items:center;align-content:center;font:600 13.5px/1.2 var(--font-body)}
.picker button small{font-size:11px;font-weight:500;color:var(--muted)}
.picker button[aria-pressed=true]{border-color:var(--accent-strong);box-shadow:inset 0 0 0 1px var(--accent-strong)}
.picker button.done small{color:var(--good-ink)}
.ex{display:grid;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0;padding-top:2px}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-n{font-weight:600;font-size:15.5px;line-height:1.4}
.ex-e{font-size:12px;color:var(--muted);direction:ltr;text-align:right}
.vid{font-size:12.5px;white-space:nowrap;padding:2px 0}
.rx{font:600 15px/1.4 var(--font-display);color:var(--ink)}
.rx span{font:500 13px var(--font-body);color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-2)}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:20px minmax(0,1fr) 12px minmax(0,1fr) 46px;gap:6px;align-items:center}
.set .n{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.set .x{text-align:center;color:var(--muted)}
.set input{width:100%;min-width:0;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:600 16px/1 var(--font-body);text-align:center;direction:ltr;padding:0 4px}
.set input::placeholder{font-weight:400;font-size:13px;color:var(--muted)}
.set .ok{height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.set .ok svg{width:18px;height:18px}
.set.done .ok{background:var(--good);border-color:var(--good);color:#fff}
.set.done input{background:var(--surface-2)}
.set.nobw{grid-template-columns:20px minmax(0,1fr) 46px}
.rir{display:grid;gap:4px}
.rir > span{font-size:12.5px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;background:transparent;text-align:start;padding:9px 0;border-top:1px solid var(--line);font:inherit}
.chk:first-of-type{border-top:0}
.chk .t{flex:1;min-width:0}
.chk .t b{font-weight:600;display:block;line-height:1.45}
.chk .t small{display:block;font-size:13px;color:var(--ink-2);line-height:1.5}
.chk .t em{display:block;font-style:normal;font-size:12px;color:var(--muted);direction:ltr;text-align:right}
.chk .dose{font:600 13.5px/1.5 var(--font-display);white-space:nowrap;color:var(--ink)}
.saved{display:grid;gap:8px}
.saved ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;color:var(--ink-2)}
.saved li{display:grid;gap:0}
.saved li b{font-weight:600;color:var(--ink)}
.nw{white-space:nowrap}

/* ---------- zones ---------- */
.zones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.zone{display:grid;gap:4px;justify-items:center;text-align:center}
.zone i{display:block;width:100%;height:10px;border-radius:3px}
.zone b{font:600 12.5px/1.2 var(--font-body)}
.zone span{font-size:12px;color:var(--ink-2);direction:ltr}
.zone small{font-size:11px;color:var(--muted);line-height:1.3}
.zone.tg b::after{content:" ●";color:var(--accent)}
.zone.tg{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:5px}

/* ---------- plan ---------- */
.phase{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.phase:first-of-type{border-top:0}
.phase .no{width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font:700 16px var(--font-display)}
.phase.cur .no{background:var(--accent-strong);color:var(--on-accent)}
.phase p{font-size:14px;color:var(--ink-2)}
.phase dl{margin:6px 0 0;display:grid;gap:2px;font-size:13px}
.phase dt{display:inline;font-weight:600}
.phase dd{display:inline;margin:0;color:var(--ink-2)}
.rhythm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.rhythm div{background:var(--surface-2);border-radius:6px;padding:8px 2px;text-align:center;font:600 12.5px/1.3 var(--font-body);min-width:0}
.rhythm div small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
.rhythm .rest{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{display:grid;gap:2px}
.rules b{font-weight:600}
.rules span{font-size:14px;color:var(--ink-2)}
.plist{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:14px}
.plist li{display:flex;justify-content:space-between;gap:10px}
.plist .nm{min-width:0}
.plist .rxs{font:600 13px/1.6 var(--font-display);white-space:nowrap}
.mob{margin:0;padding:0;list-style:none;display:grid}
.mob li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,44%);gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.mob li:first-child{border-top:0}
.mob b{font-weight:600;display:block;line-height:1.45}
.mob small{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.mob .ds{font:600 13px/1.6 var(--font-display);text-align:left}
.plist .bt{font-size:12.5px;font-weight:600;color:var(--muted);padding-top:6px}

/* ---------- progress ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:4px;min-width:0;align-content:start}
.tile .lb{font-size:13px;color:var(--ink-2);line-height:1.4}
.tile .lb b{display:block;font-weight:600;color:var(--ink)}
.tile .val{font:600 24px/1.2 var(--font-body)}
.tile .val small{font-size:13px;font-weight:500;color:var(--muted)}
.tile .dl{font-size:12.5px;color:var(--ink-2)}
.tile .ft{font-size:12px;color:var(--muted)}
.tile .dl.up{color:var(--good-ink)} .tile .dl.down{color:var(--bad-ink)}
.tile .empty{font-size:13px;color:var(--muted)}
.spark{position:relative;height:56px;margin-top:4px;touch-action:pan-y}
.spark svg{display:block;width:100%;height:56px;overflow:visible}
.tip{position:absolute;top:-6px;transform:translate(-50%,-100%);pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);padding:3px 8px;border-radius:6px;font:600 12px/1.5 var(--font-body);white-space:nowrap;direction:rtl;z-index:3}
.tip small{font-weight:400;opacity:.8}
.tile details{font-size:12.5px;color:var(--ink-2)}
.tile summary{cursor:pointer;color:var(--muted)}
.tile table{border-collapse:collapse;width:100%;margin-top:4px;font-variant-numeric:tabular-nums}
.tile td{padding:2px 0;border-top:1px solid var(--line)}
.tile td:last-child{text-align:left;direction:ltr;font-weight:600}
.hist{margin:0;padding:0;list-style:none;display:grid}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.hist li:first-child{border-top:0}
.hist b{font-weight:600}
.hist small{display:block;font-size:13px;color:var(--ink-2)}

/* ---------- tests ---------- */
.tgroup{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.tgroup:first-of-type{border-top:0;padding-top:0}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.cmp th{font-weight:600;font-size:12.5px;color:var(--muted);text-align:start;padding:6px 4px;border-bottom:1px solid var(--line)}
.cmp td{padding:7px 4px;border-bottom:1px solid var(--line)}
.cmp td.n{direction:ltr;text-align:right;font-weight:600;white-space:nowrap}
.cmp .up{color:var(--good-ink)} .cmp .down{color:var(--bad-ink)}
.scroll{overflow-x:auto}
.howto{margin:0;padding-inline-start:18px;display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
.calc-out{font:600 17px/1.4 var(--font-body)}
.pct{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center}
.pct div{background:var(--surface-2);border-radius:6px;padding:6px 2px;font-size:12px;color:var(--ink-2)}
.pct b{display:block;font-size:14px;color:var(--ink);direction:ltr}

.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;background:var(--tip-bg);color:var(--tip-fg);padding:11px 14px;border-radius:10px;font-size:14px;text-align:center;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.18)}
@media (max-width:380px){ .tabs button{font-size:13px} .wk{font-size:10px} }
@media (prefers-reduced-motion:no-preference){ .set .ok,.seg button,.box{transition:background-color .12s,border-color .12s} }

const BACKUP_ID = { sessions: /^\d{4}-\d{2}-\d{2}_[A-Z0-9]{1,4}$/, checkins: /^\d{4}-\d{2}-\d{2}$/, tests: /^\d{4}-\d{2}-\d{2}$/ };

/* Merge a backup into what is here: per record, the one saved later wins, so nothing newer is ever overwritten. */
function mergeBackup(b) {
  if (!isObj(b) || !(isObj(b.sessions) || isObj(b.checkins) || isObj(b.tests) || isObj(b.profile))) throw { code: 'bad_file' };
  const next = { profile: S.profile }, count = { added: 0, updated: 0, kept: 0 };
  Object.keys(BACKUP_ID).forEach(kind => {
    const cur = Object.assign({}, S[kind]), src = isObj(b[kind]) ? b[kind] : {};
    Object.keys(src).forEach(id => {
      const d = src[id];
      if (!BACKUP_ID[kind].test(id) || !isObj(d)) return;
      const doc = prune(clone(d));
      if (!validDate(doc.date)) doc.date = id.slice(0, 10);
      if (!cur[id]) { cur[id] = doc; count.added++; }
      else if ((doc.ts || 0) > (cur[id].ts || 0)) { cur[id] = doc; count.updated++; }
      else count.kept++;
    });
    next[kind] = cur;
  });

  return { next, count };
}

function weekInfo(d) {
  const p = S.profile;
  if (!p || !validDate(p.startDate)) return null;
  const diff = dayDiff(p.startDate, d);
  if (diff < 0) return { pre: true, days: -diff };
  const w = Math.floor(diff / 7) + 1;
  const eff = w <= 16 ? w : 9 + ((w - 17) % 8);        // after week 16 the last two phases repeat
  const start = addDays(p.startDate, (w - 1) * 7);

}

const e1rm = (w, r, rir) => w * (1 + Math.min(r + (rir || 0), 20) / 30);
function bestE1(e) {
  if (e.unit && e.unit !== 'reps') return null;
  let b = 0;
  (e.sets || []).forEach(st => { if (st.w > 0 && st.r > 0) b = Math.max(b, e1rm(st.w, st.r, e.rir)); });
  return b ? r1(b) : null;
}
function lastLog(exId, skipId) {
  const list = sessList();
  for (let i = list.length - 1; i >= 0; i--) {
    const s = list[i];
    if (s._id === skipId) continue;
    const e = (s.ex || []).find(x => x.id === exId && x.sets && x.sets.length);
    if (e) return { s, e };

}
function bump(w) { const step = w < 20 ? 1 : 2.5; return Math.max(w + step, Math.round(w * 1.05 / step) * step); }
function suggest(it, rir, deload, skipId) {
  const Lg = lastLog(it.x, skipId);
  if (!Lg) return null;
  const e = Lg.e, date = Lg.s.date;
  const ws = e.sets.map(s => s.w).filter(w => w > 0);
  const minR = Math.min.apply(null, e.sets.map(s => s.r));
  if (it.bw || !ws.length) {
    const r = deload ? it.lo : Math.min(it.hi, Math.max(it.lo, minR + 1));
    return { w: null, r, e, date, why: deload ? 'أسبوع تخفيف: نفس العدات من غير زيادة' : 'زوّد عدة عن آخر مرة' };
  }
  const w = Math.max.apply(null, ws);
  const reps = e.sets.filter(s => s.w === w).map(s => s.r);
  if (it.unit === 'm') return { w, r: it.lo, e, date, why: 'لو مشيت المسافة كلها بثبات، زوّد الوزن شوية' };
  if (deload) return { w, r: Math.max(it.lo, Math.min(it.hi, Math.min.apply(null, reps))), e, date, why: 'أسبوع تخفيف: نفس الوزن من غير زيادة' };
  if (e.lo === it.lo && e.hi === it.hi) {
    if (reps.length >= Math.min(it.s, e.sets.length) && reps.every(r => r >= it.hi)) {
      return { w: bump(w), r: it.lo, e, date, why: 'وصلت لأعلى العدات: زوّد الوزن وارجع لـ ' + it.lo };
    }
    return { w, r: Math.min(it.hi, Math.max(it.lo, Math.min.apply(null, reps) + 1)), e, date, why: 'نفس الوزن، وزوّد عدة' };
  }
  const b = bestE1(e);
  if (!b) return { w, r: it.lo, e, date, why: '' };
  const tw = b / (1 + (it.lo + rir) / 30);
  return { w: Math.round(tw * 2) / 2, r: it.lo, e, date, why: 'مدى عدات جديد: الوزن محسوب من تقدير الـ 1RM' };
}

/* ---------- progress ---------- */
function tile(o) {
  const pts = o.pts || [];
  const head = '<div class="lb">' + fx(o.label) + (o.name ? '<b>' + L(o.name) + '</b>' : '') + '</div>';
  if (!pts.length) return '<div class="tile">' + head + '<div class="empty">' + fx(o.empty) + '</div></div>';
  const last = pts[pts.length - 1], first = pts[0];
  let dl = '';
  if (pts.length > 1 && !o.noDelta) {
    const d = r1(last.y - first.y);
    const cls = !o.better || d === 0 ? '' : ((d > 0) === (o.better === 'high') ? 'up' : 'down');
    dl = '<div class="dl ' + cls + '">' + (d > 0 ? '▲' : d < 0 ? '▼' : '●') + ' ' + L((d > 0 ? '+' : '') + d) + ' من أول قياس</div>';
  }
  CH[o.id] = { pts, unit: o.unit || '', type: o.type || 'line', floor: o.floor, label: o.label + (o.name ? ' ' + o.name : '') };
  return '<div class="tile">' + head + '<div class="val">' + L(o.value != null ? o.value : last.y) + ' <small>' + fx(o.unit || '') + '</small></div>' + dl
    + '<div class="spark" data-id="' + o.id + '"></div>' + (o.foot ? '<div class="ft">' + fx(o.foot) + '</div>' : '')
    + '<details><summary>الأرقام</summary><table><tbody>' + pts.slice().reverse().slice(0, 12).map(p => '<tr><td>' + L(p.x) + '</td><td>' + esc(p.y) + '</td></tr>').join('') + '</tbody></table></details></div>';
}
function viewProgress() {
  if (!S.loaded) return '<section class="card"><p class="muted">بيحمّل بياناتك…</p></section>';
  const list = sessList(), info = weekInfo(today());
  let h = '';
  if (!list.length && !Object.keys(S.checkins).length) {
    h += '<section class="card"><div><div class="eye">لسه مفيش تسجيلات</div><h2 class="h">هنا هتشوف الإشارة وهي بترجع</h2></div><p class="hint">'
      + fx('بعد أول حصة هتلاقي هنا: حضورك أسبوع بأسبوع، مؤشر الإشارة العصبية، تقدير الـ 1RM لكل حركة أساسية، نتيجة GOWOD، نبض الراحة، والـ VO2max.') + '</p></section>';
  }
  const tiles = [];
  /* attendance by program week */
  if (info && !info.pre) {
    const pts = [];
    for (let w = Math.max(1, info.w - 7); w <= info.w; w++) pts.push({ x: 'أسبوع ' + w, y: sessInWeek(w).length });
    let streak = 0;
    for (let w = info.w; w >= 1; w--) { const n = sessInWeek(w).length; if (n >= 3) streak++; else if (w === info.w) continue; else break; }
    tiles.push(tile({ id: 'att', label: 'حصص الأسبوع ده', pts, value: pts[pts.length - 1].y + ' / 5', unit: streak ? 'سلسلة ' + countAr(streak, 'أسبوع', 'أسبوعين', 'أسابيع', 'أسبوع') : '', noDelta: true, type: 'bars', floor: 3, foot: 'الخط الأفقي هو الحد الأدنى: 3 حصص' }));
  }
  /* neural signal index */
  const bl = list.filter(s => s.bench && s.bench.kg && s.bench.rpe);
  if (bl.length) {
    const kg = bl[bl.length - 1].bench.kg;
    tiles.push(tile({ id: 'sig', label: 'مؤشر الإشارة: ' + kg + ' كجم × 5', pts: bl.filter(s => s.bench.kg === kg).map(s => ({ x: fmtDate(s.date), y: s.bench.rpe })), unit: 'من 10', better: 'low' }));
  } else tiles.push(tile({ id: 'sig', label: 'مؤشر الإشارة', empty: 'بيتسجل في حصة قوة A. الرقم لما ينزل يبقى نفس الوزن بقى أخف عليك.' }));
  /* estimated 1RM per movement family */
  [['Squat', ['squat', 'goblet']], ['Hinge', ['trapDL', 'rdl']], ['Press', ['inclinePress', 'landmine']], ['Pull', ['pullup', 'cableRow', 'pulldown', 'csRow']]].forEach((f, fi) => {
    let pick = null, pickDate = '';
    f[1].forEach(id => { list.forEach(s => (s.ex || []).forEach(e => { if (e.id === id && e.e1 && s.date >= pickDate) { pick = id; pickDate = s.date; } })); });
    if (!pick) { tiles.push(tile({ id: 'rm' + fi, label: '1RM تقديري', name: f[0], empty: 'هيظهر بعد أول حصة فيها الحركة دي.' })); return; }
    const pts = [];
    list.forEach(s => (s.ex || []).forEach(e => { if (e.id === pick && e.e1) pts.push({ x: fmtDate(s.date), y: e.e1 }); }));
    tiles.push(tile({ id: 'rm' + fi, label: '1RM تقديري', name: EX[pick].en, pts, unit: 'كجم', better: 'high' }));
  });
  /* mobility: GOWOD score, and the weakest zone in the latest reading */
  const gd = Object.keys(S.tests).filter(validDate).sort(), gw = gowodLatest();
  tiles.push(tile({ id: 'gw', label: 'GOWOD Mobility Score', pts: gd.filter(d => S.tests[d].gwAll != null).map(d => ({ x: fmtDate(d), y: S.tests[d].gwAll })), unit: 'من 100', better: 'high', empty: 'سجّل نتيجة اختبار GOWOD في القياسات.' }));
  if (gw && gw.zones.length) {
    const z = gw.zones[0];
    tiles.push(tile({ id: 'gwz', label: 'أضعف منطقة في GOWOD', name: z.n, pts: gd.filter(d => S.tests[d][z.k] != null).map(d => ({ x: fmtDate(d), y: S.tests[d][z.k] })), unit: '%', better: 'high' }));
  }
  /* resting HR (check-ins + tests) */
  const rh = {};
  Object.keys(S.checkins).forEach(d => { if (S.checkins[d].rhr) rh[d] = S.checkins[d].rhr; });
  Object.keys(S.tests).forEach(d => { if (S.tests[d].rhr) rh[d] = S.tests[d].rhr; });
  const rhp = Object.keys(rh).sort().map(d => ({ x: fmtDate(d), y: rh[d] }));
  tiles.push(tile({ id: 'rhr', label: 'نبض الراحة', pts: rhp, unit: 'نبضة/د', better: 'low', empty: 'سجّله الصبح في فحص الجاهزية.' }));
  /* VO2max: Cooper results first, else watch estimate */
  const vo = {};
  Object.keys(S.tests).forEach(d => { if (S.tests[d].cooper) vo[d] = cooperVo2(S.tests[d].cooper); });
  list.forEach(s => { if (s.cardio && s.cardio.vo2) vo[s.date] = s.cardio.vo2; });
  const vop = Object.keys(vo).sort().map(d => ({ x: fmtDate(d), y: vo[d] }));
  const vw = Object.keys(S.tests).filter(d => S.tests[d].vo2w).sort().map(d => ({ x: fmtDate(d), y: S.tests[d].vo2w }));
  if (vop.length) tiles.push(tile({ id: 'vo2', label: 'VO2max من Cooper', pts: vop, unit: 'مل/كجم/د', better: 'high' }));
  if (vw.length || !vop.length) tiles.push(tile({ id: 'vo2w', label: 'VO2max من الساعة', pts: vw, unit: 'مل/كجم/د', better: 'high', empty: 'سجّل تقدير الساعة في القياسات. اختبار Cooper من الأسبوع 8.' }));
  /* Zone 2 efficiency: metres covered per heartbeat */
  const z2 = list.filter(s => s.cardio && (s.cardio.t === 'z2' || s.cardio.t === 'strides') && s.cardio.km && s.cardio.hr && s.cardio.min);
  if (z2.length) {
    const mode = z2[z2.length - 1].cardio.mode;
    tiles.push(tile({ id: 'mpb', label: 'كفاءة Zone 2 (' + (mode || '') + ')', pts: z2.filter(s => s.cardio.mode === mode).map(s => ({ x: fmtDate(s.date), y: Math.round(s.cardio.km * 1000 / (s.cardio.hr * s.cardio.min) * 100) / 100 })), unit: 'متر لكل نبضة', better: 'high' }));
  }
  /* sleep */
  const sl = Object.keys(S.checkins).sort().filter(d => S.checkins[d].sleepH != null).slice(-14).map(d => ({ x: fmtDate(d), y: S.checkins[d].sleepH }));
  if (sl.length) {
    const l7 = sl.slice(-7), avg = r1(l7.reduce((a, p) => a + p.y, 0) / l7.length);
    tiles.push(tile({ id: 'slp', label: 'متوسط النوم آخر ' + l7.length + ' أيام', pts: sl, value: avg, unit: 'ساعة', better: 'high' }));
  }
  h += '<div class="tiles">' + tiles.join('') + '</div>';
  if (list.length) {
    h += '<section class="card"><div><div class="eye">آخر ' + fx(countAr(Math.min(15, list.length), 'حصة', 'حصتين', 'حصص', 'حصة')) + '</div><h2 class="h">سجل الحصص</h2></div><ul class="hist">';
    list.slice().reverse().slice(0, 15).forEach(s => {
      const conf = S.ui.confirm === s._id;
      h += '<li><div><b>' + esc(dayName(s.date)) + ' ' + L(fmtDate(s.date)) + ' · ' + fx(sessTitle(s.key, null)) + '</b><small>' + fx(sessSummary(s)) + (s.ready ? ' · جاهزية ' + L(s.ready.score) : '') + '</small></div>'
        + '<button type="button" class="btn sm ' + (conf ? 'danger' : 'ghost') + '" data-act="del" data-kind="sessions" data-id="' + esc(s._id) + '">' + (conf ? 'متأكد؟' : 'امسح') + '</button></li>';
    });
    h += '</ul></section>';
  }
  return h;
}

/* ---------- charts: single-series sparklines and weekly columns, drawn at real pixel size ---------- */
function drawCharts() { $$('.spark').forEach(drawSpark); }
function drawSpark(el) {
  const d = CH[el.dataset.id];
  if (!d) return;
  const w = Math.max(120, el.clientWidth || 200), h = 56, px = 7, pt = 9, pb = 7, n = d.pts.length;
  const ys = d.pts.map(p => p.y);
  let mn = Math.min.apply(null, ys), mx = Math.max.apply(null, ys);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, at) => { const e = document.createElementNS(NS, tag); Object.keys(at).forEach(k => e.setAttribute(k, at[k])); return e; };
  const svg = mk('svg', { width: w, height: h, viewBox: '0 0 ' + w + ' ' + h, role: 'img', tabindex: '0', 'aria-label': d.label + '، ' + n + ' قيم، الأخيرة ' + ys[n - 1] });
  let X, Y;
  if (d.type === 'bars') {
    mn = 0; mx = Math.max(5, mx);
    const band = (w - 2 * px) / n, bw = Math.min(24, band - 4);
    X = i => px + band * i + band / 2;
    Y = v => pt + (h - pt - pb) * (1 - v / mx);
    svg.appendChild(mk('line', { x1: 0, x2: w, y1: Y(0), y2: Y(0), stroke: 'var(--line)', 'stroke-width': 1 }));
    if (d.floor) svg.appendChild(mk('line', { x1: 0, x2: w, y1: Y(d.floor), y2: Y(d.floor), stroke: 'var(--line)', 'stroke-width': 1 }));
    d.pts.forEach((p, i) => {
      if (p.y <= 0) return;
      const x0 = X(i) - bw / 2, y0 = Y(p.y), y1 = Y(0), rr = Math.min(4, (y1 - y0));
      svg.appendChild(mk('path', { d: 'M' + x0 + ' ' + y1 + ' V' + (y0 + rr) + ' Q' + x0 + ' ' + y0 + ' ' + (x0 + rr) + ' ' + y0 + ' H' + (x0 + bw - rr) + ' Q' + (x0 + bw) + ' ' + y0 + ' ' + (x0 + bw) + ' ' + (y0 + rr) + ' V' + y1 + ' Z',
        fill: p.y >= (d.floor || 0) ? 'var(--accent)' : 'var(--muted)', 'fill-opacity': p.y >= (d.floor || 0) ? 1 : 0.55, 'data-i': i }));
    });
  } else {
    if (mn === mx) { mn -= 1; mx += 1; }
    X = i => n === 1 ? w - px : px + (w - 2 * px) * i / (n - 1);
    Y = v => pt + (h - pt - pb) * (1 - (v - mn) / (mx - mn));
    svg.appendChild(mk('line', { x1: 0, x2: w, y1: h - 0.5, y2: h - 0.5, stroke: 'var(--line)', 'stroke-width': 1 }));
    if (n > 1) {
      const line = d.pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
      svg.appendChild(mk('path', { d: line + ' L' + X(n - 1).toFixed(1) + ' ' + (h - 1) + ' L' + X(0).toFixed(1) + ' ' + (h - 1) + ' Z', fill: 'var(--accent)', 'fill-opacity': 0.1 }));
      svg.appendChild(mk('path', { d: line, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    }
    svg.appendChild(mk('circle', { cx: X(n - 1), cy: Y(ys[n - 1]), r: 4, fill: 'var(--accent)', stroke: 'var(--surface)', 'stroke-width': 2 }));
  }
  const cross = mk('line', { x1: 0, x2: 0, y1: 0, y2: h, stroke: 'var(--muted)', 'stroke-width': 1, visibility: 'hidden' });
  const dot = mk('circle', { r: 4, fill: 'var(--accent)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' });
  svg.appendChild(cross); svg.appendChild(dot);
  const tip = document.createElement('div');
  tip.className = 'tip'; tip.hidden = true;
  el.textContent = '';
  el.appendChild(svg); el.appendChild(tip);
  let cur = n - 1;
  const show = i => {
    cur = Math.max(0, Math.min(n - 1, i));
    const p = d.pts[cur], x = X(cur);
    cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
    if (d.type !== 'bars') { dot.setAttribute('cx', x); dot.setAttribute('cy', Y(p.y)); dot.setAttribute('visibility', 'visible'); }
    tip.textContent = '';
    const b = document.createElement('b'); b.textContent = p.y + (d.unit && d.type !== 'bars' ? ' ' + d.unit : '');
    const sm = document.createElement('small'); sm.textContent = ' ' + p.x;
    tip.appendChild(b); tip.appendChild(sm);
    tip.hidden = false;
    tip.style.left = Math.max(44, Math.min(w - 44, x)) + 'px';
  };
  const hide = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
  const near = ev => {
    const r = el.getBoundingClientRect(), x = ev.clientX - r.left;
    let best = 0, bd = Infinity;
    for (let i = 0; i < n; i++) { const dd = Math.abs(X(i) - x); if (dd < bd) { bd = dd; best = i; } }
    show(best);
  };
  el.addEventListener('pointermove', near);
  el.addEventListener('pointerdown', near);
  el.addEventListener('pointerleave', hide);
  svg.addEventListener('focus', () => show(n - 1));
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft') { show(cur - 1); ev.preventDefault(); }
    if (ev.key === 'ArrowRight') { show(cur + 1); ev.preventDefault(); }
  });
}

async function finishSession() {
  if (notLoaded() || !CTX) return;
  const c = CTX, t = c.date, dr = draftFor(c.key), ci = S.checkins[t];
  const doc = {
    date: t, key: c.key, week: c.info.w, eff: c.info.eff, phase: c.info.phase, deload: c.info.deload, mode: c.mode,

    notes: (dr.notes || '').trim().slice(0, 500), ts: Date.now(),
  };
  if (c.kind === 'lift') {
    const ex = [];
    c.P.main.forEach(it => {
      const d = dr.ex[it.x];

      const sets = d.sets.filter(s => s.done).map(s => ({ w: it.bw ? 0 : (num(s.w) || 0), r: num(s.r) || 0 })).filter(s => s.r > 0);
      if (!sets.length) return;

    if (cooper && (!mtr || mtr < 600)) return toast('اكتب مسافة الاختبار بالمتر');
    doc.cardio = {
      t: c.cp.t, mode: cd.mode || (cooper ? 'Run' : CARDIO_MODES[0]), min,
      hr: num(cd.hr), hrMax: num(cd.hrMax), km: cooper ? Math.round(mtr) / 1000 : num(cd.km), rpe: num(cd.rpe), reps: num(cd.reps),
    };

async function onClick(ev) {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act !== 'del') S.ui.confirm = null;                 // any other action cancels a pending delete
  switch (act) {
    case 'tab': S.tab = b.dataset.v; render(); window.scrollTo(0, 0); break;
    case 'start': return doStart();
    case 'ci-step': {
      const c0 = ciDraft();
      c0.sleepH = Math.max(0, Math.min(12, c0.sleepH + parseFloat(b.dataset.d)));
      $('#ci-sleep').innerHTML = L(c0.sleepH) + ' <small>ساعة</small>';
      break;
    }
    case 'ci-set': { const g = b.closest('[data-seg]'); ciDraft()[g.dataset.seg] = +b.dataset.v; setPressed(g, b.dataset.v); break; }
    case 'ci-joint': { const c0 = ciDraft(); c0.jointPain = !c0.jointPain; b.setAttribute('aria-checked', String(c0.jointPain)); break; }
    case 'ci-save': return saveCheckin();
    case 'ci-edit': S.ci = null; S.ui.editCi = true; render(); break;
    case 'override': S.ui.override = S.ui.override === today() ? null : today(); S.ui.key = null; render(); break;
    case 'pick': S.ui.key = b.dataset.k; S.ui.keyDate = today(); S.ui.editing = null; render(); break;
    case 'set-ok': {
      if (!CTX) break;
      const row = b.closest('.set'), d = draftFor(CTX.key).ex[row.dataset.ex], s = d && d.sets[+row.dataset.i];
      if (!s) break;
      $$('input', row).forEach(inp => { s[inp.dataset.f] = inp.value; });
      if (!s.done && !(num(s.r) > 0)) { toast('اكتب العدات الأول'); break; }
      s.done = !s.done;
      row.classList.toggle('done', s.done);
      b.setAttribute('aria-pressed', String(s.done));
      saveDrafts();
      break;
    }
    case 'add-set': {
      if (!CTX) break;
      const d = draftFor(CTX.key).ex[b.dataset.ex];
      if (!d) break;
      const ls = d.sets[d.sets.length - 1];
      d.sets.push({ w: ls ? ls.w : '', r: ls ? ls.r : '', done: false, extra: true });
      saveDrafts();
      render();
      break;
    }
    case 'rir': {
      if (!CTX) break;
      const g = b.closest('[data-seg]'), d = draftFor(CTX.key).ex[g.dataset.seg.split(':')[1]];
      if (d) { d.rir = +b.dataset.v; setPressed(g, b.dataset.v); saveDrafts(); }
      break;
    }
    case 'chk': {
      if (!CTX) break;
      const dr = draftFor(CTX.key), id = b.dataset.id;
      dr.checks[id] = !dr.checks[id];
      b.setAttribute('aria-checked', String(!!dr.checks[id]));
      saveDrafts();
      break;
    }
    case 'bench-rpe': draftFor('A').bench.rpe = b.dataset.v; setPressed(b.closest('[data-seg]'), b.dataset.v); saveDrafts(); break;
    case 'cd-rpe': if (CTX) { draftFor(CTX.key).cardio.rpe = b.dataset.v; setPressed(b.closest('[data-seg]'), b.dataset.v); saveDrafts(); } break;
    case 'finish': return finishSession();
    case 'edit-saved': {
      const id = b.dataset.id, s = S.sessions[id];
      if (!s) break;
      const dr = draftFor(s.key), c0 = s.cardio || {}, str = v => v == null ? '' : String(v);
      dr.ex = {};
      (s.ex || []).forEach(e => { dr.ex[e.id] = { sets: e.sets.map(x => ({ w: x.w ? String(x.w) : '', r: String(x.r), done: true })), rir: e.rir == null ? 2 : e.rir }; });
      dr.cardio = { mode: c0.mode, min: c0.min == null ? null : String(c0.min), hr: str(c0.hr), hrMax: str(c0.hrMax), km: str(c0.km), m: str(c0.m), rpe: str(c0.rpe), reps: str(c0.reps) };
      dr.bench = s.bench ? { kg: String(s.bench.kg), rpe: String(s.bench.rpe) } : {};
      dr.notes = s.notes || '';
      dr.checks = {};
      S.ui.editing = id; S.ui.key = s.key; S.ui.keyDate = today();
      saveDrafts();
      render();
      break;
    }
    case 'del': {
      if (notLoaded()) break;
      const kind = b.dataset.kind, id = b.dataset.id, cid = (kind === 'tests' ? 't' : '') + id;
      if (S.ui.confirm !== cid) { S.ui.confirm = cid; render(); break; }
      S.ui.confirm = null;
      try { await Store.del(kind, id); toast('اتمسح'); render(); } catch (e) { saveError(e); }
      break;
    }
    case 'mob': return toggleMob();
    case 'plan-phase': S.ui.planPhase = +b.dataset.v; render(); break;
    case 'test-save': return saveTest();
    case 'calc-rir': S.calc.rir = b.dataset.v; setPressed(b.closest('[data-seg]'), b.dataset.v); updateCalc(); break;
    case 'prof-save': return saveProfile();
    case 'med': return toggleMed();
    case 'backup': return exportBackup();
    case 'restore': { const f = $('#imp-file'); if (f) { f.value = ''; f.click(); } break; }
    case 'install': {
      const e = INSTALL.evt;
      if (!e) break;
      INSTALL.evt = null;
      try { e.prompt(); await e.userChoice; } catch (err) { /* dismissed */ }
      render();
      break;
    }
  }
}
function onInput(ev) {
  const el = ev.target, ds = el.dataset || {};
  if (el.matches && el.matches('.set input')) {
    if (!CTX) return;
    const row = el.closest('.set'), d = draftFor(CTX.key).ex[row.dataset.ex], i = +row.dataset.i, f = ds.f;
    if (!d || !d.sets[i]) return;
    const old = d.sets[i][f];
    d.sets[i][f] = el.value;
    if (f === 'w') {                                    // carry a new weight down to the sets not done yet
      for (let j = i + 1; j < d.sets.length; j++) {
        const s = d.sets[j];
        if (!s.done && (s.w === old || s.w === '')) {
          s.w = el.value;
          const o = $('#s-' + row.dataset.ex + '-' + j + '-w');
          if (o) o.value = el.value;
        }
      }
    }
    saveDrafts();
    return;
  }
  if (ds.c) {
    if (!CTX) return;
    draftFor(CTX.key).cardio[ds.c] = el.value;
    if (ds.c === 'm') { const o = $('#cooper-out'); if (o) o.innerHTML = cooperOut(el.value); }
    saveDrafts();
    return;
  }
  if (ds.b) { draftFor('A').bench[ds.b] = el.value; saveDrafts(); return; }
  if (ds.n) { if (CTX) { draftFor(CTX.key).notes = el.value; saveDrafts(); } return; }
  if (ds.ci) { ciDraft()[ds.ci] = el.value; return; }
  if (ds.t) { if (S.tdraft) S.tdraft.v[ds.t] = el.value; return; }
  if (ds.td) { if (ev.type === 'change' && validDate(el.value)) { S.tdraft = { date: el.value, v: {} }; render(); } return; }
  if (ds.p) { if (S.pdraft) S.pdraft[ds.p] = el.value; return; }
  if (ds.calc) { S.calc[ds.calc] = el.value; updateCalc(); return; }
  if (ds.imp) { if (ev.type === 'change' && el.files && el.files[0]) importBackup(el.files[0]); return; }
}

/* the installed copy: offline shell + the browser's own install prompt */
const INSTALL = { evt: null };
if (STANDALONE) {
  window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); INSTALL.evt = ev; scheduleRender(); });
  window.addEventListener('appinstalled', () => { INSTALL.evt = null; toast('اتثبّت. هتلاقيه على الشاشة الرئيسية'); scheduleRender(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
}
const appEl = $('#app');
appEl.addEventListener('click', onClick);
appEl.addEventListener('input', onInput);
appEl.addEventListener('change', onInput);
document.addEventListener('focusout', () => { if (deferred) { deferred = false; setTimeout(scheduleRender, 0); } });

/* ================= boot ================= */
(function boot() {
  const h = (location.hash || '').replace('#', '');
  if (VIEWS[h]) S.tab = h;
  S.profile = LS.get('profile_cache_v1');               // last known profile, used for the first frame only
  render();
  Store.init();
  let rz = null;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleRender(); });   // the date may have changed
})();

})();
</script>
